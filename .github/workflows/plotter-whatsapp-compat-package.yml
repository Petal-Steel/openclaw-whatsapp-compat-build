name: Plotter WhatsApp Compatibility Package

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plotter-whatsapp-compat-package-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC
  SOURCE_DATE_EPOCH: "1792627200"
  OPENCLAW_BUILD_TIMESTAMP: "2026-10-22T00:00:00.000Z"
  OPENCLAW_BUILD_CACHE: "0"

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout CI harness and compatibility source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin package source to the compatibility commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          patch_commit="$(git rev-parse HEAD^)"
          base_commit="$(git rev-parse 'v2026.10.5^{commit}')"
          test "$(git rev-parse "${patch_commit}^")" = "$base_commit"
          test "$(git diff-tree --no-commit-id --name-only -r "$patch_commit" | wc -l)" -eq 17
          git checkout --detach "$patch_commit"
          echo "patch_commit=$patch_commit" >> "$GITHUB_OUTPUT"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tag=v2026.10.5" >> "$GITHUB_OUTPUT"

      - name: Set up Node 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Install locked workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          test "$(corepack pnpm --version)" = "12.9.0"
          corepack pnpm install --frozen-lockfile

      - name: Run WhatsApp account and reload regressions
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          OPENCLAW_VITEST_MAX_WORKERS: "1"
        run: |
          set -euo pipefail
          node_modules/.bin/vitest run \
            --config test/vitest/vitest.extension-database-workers.config.ts \
            whatsapp/src/auto-reply/monitor.reload.test.ts \
            --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=verbose

      - name: Run durable-delivery authorization regressions
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          OPENCLAW_VITEST_MAX_WORKERS: "1"
        run: |
          set -euo pipefail
          node_modules/.bin/vitest run \
            --config test/vitest/vitest.infra.config.ts \
            src/channels/turn/durable-delivery.reload.test.ts \
            --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=verbose

      - name: Build and check package reproducibility
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-package-first" "$RUNNER_TEMP/openclaw-package-second"
          corepack pnpm build:package
          first_tgz="$(npm pack --pack-destination "$RUNNER_TEMP/openclaw-package-first" --silent)"
          first_path="$RUNNER_TEMP/openclaw-package-first/$first_tgz"
          first_sha="$(sha256sum "$first_path" | cut -d ' ' -f 1)"

          corepack pnpm build:package
          second_tgz="$(npm pack --pack-destination "$RUNNER_TEMP/openclaw-package-second" --silent)"
          second_path="$RUNNER_TEMP/openclaw-package-second/$second_tgz"
          second_sha="$(sha256sum "$second_path" | cut -d ' ' -f 1)"
          test "$first_sha" = "$second_sha"
          cp "$second_path" "$RUNNER_TEMP/openclaw-package.tgz"
          echo "OPENCLAW_PACKAGE_SHA256=$second_sha" >> "$GITHUB_ENV"

      - name: Install and smoke-test the isolated package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-isolated"
          npm install --prefix "$RUNNER_TEMP/openclaw-isolated" \
            --no-audit --no-fund "$RUNNER_TEMP/openclaw-package.tgz"
          cli="$RUNNER_TEMP/openclaw-isolated/node_modules/openclaw/openclaw.mjs"
          test "$(node "$cli" --version)" = "2026.10.5"
          node "$cli" --help >/dev/null
          rg -q "admittedConfig\.channels" "$RUNNER_TEMP/openclaw-isolated/node_modules/openclaw/dist"

      - name: Write build provenance
        shell: bash
        env:
          PATCH_COMMIT: ${{ steps.source.outputs.patch_commit }}
          BASE_COMMIT: ${{ steps.source.outputs.base_commit }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-package-artifact"
          cp "$RUNNER_TEMP/openclaw-package.tgz" "$RUNNER_TEMP/openclaw-package-artifact/"
          cat > "$RUNNER_TEMP/openclaw-package-artifact/build-manifest.json" <<EOF
          {
            "sourceTag": "v2026.10.5",
            "baseCommit": "$BASE_COMMIT",
            "compatibilityPatchCommit": "$PATCH_COMMIT",
            "builtSourceCommit": "$SOURCE_COMMIT",
            "upstreamFixCommit": "2c760972446b4855007af0fcb8baf14853852546",
            "node": "$(node --version)",
            "pnpm": "$(corepack pnpm --version)",
            "buildTimestampUtc": "$OPENCLAW_BUILD_TIMESTAMP",
            "sourceDateEpoch": "$SOURCE_DATE_EPOCH",
            "packageSha256": "$OPENCLAW_PACKAGE_SHA256"
          }
          EOF
          sha256sum "$RUNNER_TEMP/openclaw-package-artifact/openclaw-package.tgz" \
            > "$RUNNER_TEMP/openclaw-package-artifact/SHA256SUMS"

      - name: Upload verified package and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-v2026.10.5-whatsapp-compat-${{ steps.source.outputs.patch_commit }}
          path: ${{ runner.temp }}/openclaw-package-artifact/
          if-no-files-found: error
          retention-days: 14
